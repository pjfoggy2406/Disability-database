<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบฐานข้อมูลผู้พิการ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Sarabun', sans-serif; }</style>
</head>
<body class="bg-slate-100 text-slate-800 p-4 md:p-8">
  <div class="max-w-5xl mx-auto space-y-6">
    <!-- ส่วนหัว -->
    <div class="bg-blue-700 text-white p-6 rounded-xl shadow">
      <h1 class="text-2xl font-bold">ระบบฐานข้อมูลผู้พิการ</h1>
      <p class="text-blue-100 text-sm mt-1">บันทึกและสืบค้นข้อมูล เชื่อมต่อฐานข้อมูล Google Sheets อัตโนมัติ</p>
    </div>

    <!-- ฟอร์มบันทึกข้อมูล -->
    <div class="bg-white p-6 rounded-xl shadow">
      <h2 class="text-lg font-bold text-blue-800 mb-4">เพิ่มข้อมูลผู้พิการรายใหม่</h2>
      <form id="dataForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold mb-1">เลขบัตรประชาชน (13 หลัก)</label>
          <input type="text" id="idCard" maxlength="13" required class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="เช่น 1809900123456">
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1">ชื่อ-นามสกุล</label>
          <input type="text" id="fullName" required class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="เช่น นายสมชาย ใจดี">
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1">ประเภทความพิการ</label>
          <select id="disabilityType" required class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="">-- เลือกประเภทความพิการ --</option>
            <option value="ทางการเห็น">1. ทางการเห็น</option>
            <option value="ทางการได้ยินหรือสื่อความหมาย">2. ทางการได้ยินหรือสื่อความหมาย</option>
            <option value="ทางการเคลื่อนไหวหรือทางร่างกาย">3. ทางการเคลื่อนไหวหรือทางร่างกาย</option>
            <option value="ทางจิตใจหรือพฤติกรรม">4. ทางจิตใจหรือพฤติกรรม</option>
            <option value="ทางสติปัญญา">5. ทางสติปัญญา</option>
            <option value="ทางการเรียนรู้">6. ทางการเรียนรู้</option>
            <option value="ทางออทิสติก">7. ทางออทิสติก</option>
            <option value="พิการซ้ำซ้อน">8. พิการซ้ำซ้อน</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1">เบอร์โทรศัพท์ติดต่อ</label>
          <input type="text" id="phone" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="เช่น 0812345678">
        </div>
        <div class="md:col-span-2">
          <label class="block text-sm font-semibold mb-1">ที่อยู่ / ตำบล</label>
          <input type="text" id="address" required class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="บ้านเลขที่ หมู่ ตำบล อำเภอ">
        </div>
        <div class="md:col-span-2">
          <label class="block text-sm font-semibold mb-1">หมายเหตุ / ความต้องการช่วยเหลือ</label>
          <input type="text" id="note" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="ระบุรายละเอียดเพิ่มเติม (ถ้ามี)">
        </div>
        <div class="md:col-span-2 flex justify-end">
          <button type="submit" id="submitBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2.5 rounded-lg transition">
            บันทึกข้อมูล
          </button>
        </div>
      </form>
    </div>

    <!-- ตารางแสดงข้อมูลและช่องค้นหา -->
    <div class="bg-white p-6 rounded-xl shadow">
      <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-4">
        <h2 class="text-lg font-bold text-slate-800">รายชื่อในฐานข้อมูล (<span id="totalCount">0</span> ราย)</h2>
        <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="ค้นหาชื่อ, เลขบัตร, ประเภท..." class="border rounded-lg px-4 py-2 w-full md:w-72 focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-sm">
          <thead>
            <tr class="bg-slate-100 border-b">
              <th class="p-3">ชื่อ-นามสกุล</th>
              <th class="p-3">เลขบัตรประชาชน</th>
              <th class="p-3">ประเภทความพิการ</th>
              <th class="p-3">เบอร์โทร</th>
              <th class="p-3">ที่อยู่/ตำบล</th>
              <th class="p-3">หมายเหตุ</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="6" class="p-4 text-center text-slate-400">กำลังโหลดข้อมูล...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx2pcfCQUSdSjIz585SHJc71qyrimbH1bnOrHFy2HrTpBfwP8rFn0PuQB_tFXzwD_Zi/exec';
    let allData = [];

    // โหลดข้อมูลเมื่อเปิดเว็บ
    async function loadData() {
      try {
        const res = await fetch(SCRIPT_URL);
        allData = await res.json();
        renderTable(allData);
      } catch (err) {
        document.getElementById('tableBody').innerHTML = '<tr><td colspan="6" class="p-4 text-center text-red-500">ไม่สามารถโหลดข้อมูลได้ กรุณาตรวจสอบ URL</td></tr>';
      }
    }

    function renderTable(data) {
      const tbody = document.getElementById('tableBody');
      document.getElementById('totalCount').innerText = data.length;
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-slate-400">ยังไม่มีข้อมูลในระบบ</td></tr>';
        return;
      }
      tbody.innerHTML = data.map(row => `
        <tr class="border-b hover:bg-slate-50">
          <td class="p-3 font-semibold">${row['ชื่อ-นามสกุล'] || '-'}</td>
          <td class="p-3">${row['เลขบัตรประชาชน'] || '-'}</td>
          <td class="p-3"><span class="bg-blue-100 text-blue-800 px-2 py-1 rounded text-xs">${row['ประเภทความพิการ'] || '-'}</span></td>
          <td class="p-3">${row['เบอร์โทรศัพท์'] || '-'}</td>
          <td class="p-3">${row['ที่อยู่/ตำบล'] || '-'}</td>
          <td class="p-3 text-slate-500">${row['หมายเหตุ'] || '-'}</td>
        </tr>
      `).join('');
    }

    function filterTable() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allData.filter(row =>
        Object.values(row).some(val => String(val).toLowerCase().includes(q))
      );
      try {
            await fetch(SCRIPT_URL, {
              method: 'POST',
              mode: 'no-cors', // เพิ่มบรรทัดนี้เพื่อแก้ปัญหาเบราว์เซอร์บล็อกข้ามโดเมน
              headers: {
                'Content-Type': 'text/plain;charset=utf-8' // ป้องกันระบบติด Preflight check
              },
              body: JSON.stringify(payload)
            });

            alert('บันทึกข้อมูลเรียบร้อยแล้ว');
            document.getElementById('dataForm').reset();
            
            // หน่วงเวลา 1.5 วินาทีเพื่อให้ Google Sheets บันทึกเสร็จก่อนดึงตารางใหม่
            setTimeout(() => {
              loadData();
            }, 1500);
          } catch (err) {
            alert('เกิดข้อผิดพลาดในการบันทึก: ' + err.message);
          } finally {
            btn.disabled = false;
            btn.innerText = 'บันทึกข้อมูล';
          }

    document.getElementById('dataForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = 'กำลังบันทึก...';

      const payload = {
        idCard: document.getElementById('idCard').value,
        fullName: document.getElementById('fullName').value,
        disabilityType: document.getElementById('disabilityType').value,
        phone: document.getElementById('phone').value,
        address: document.getElementById('address').value,
        note: document.getElementById('note').value
      };

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        alert('บันทึกข้อมูลเรียบร้อยแล้ว');
        document.getElementById('dataForm').reset();
        loadData();
      } catch (err) {
        alert('เกิดข้อผิดพลาดในการบันทึก');
      } finally {
        btn.disabled = false;
        btn.innerText = 'บันทึกข้อมูล';
      }
    });

    loadData();
  </script>
</body>
</html>
